<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente para a Maçã -->
    <linearGradient id="appleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" /> <!-- azul claro -->
      <stop offset="100%" stop-color="#1d4ed8" /> <!-- azul escuro -->
    </linearGradient>
    <!-- Gradiente para a Folha -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" /> <!-- verde -->
      <stop offset="100%" stop-color="#34d399" /> <!-- verde claro -->
    </linearGradient>
    <!-- Sombra suave para profundidade -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#1e293b" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <!-- Corpo da Maçã estilizado em curvas suaves e modernas -->
  <path d="M256,120 C220,120 180,95 120,95 C60,95 30,140 30,230 C30,360 140,470 256,470 C372,470 482,360 482,230 C482,140 452,95 392,95 C332,95 292,120 256,120 Z" 
        fill="url(#appleGrad)" 
        filter="url(#dropShadow)" />
        
  <!-- Parte interna brilhante (efeito reflexo de vidro/premium) -->
  <path d="M120,120 C90,120 60,150 56,210 C50,300 130,410 230,436 C240,438 245,430 240,422 C160,390 100,290 110,200 C112,180 125,120 120,120 Z" 
        fill="#ffffff" 
        opacity="0.12" />

  <!-- Folha curva elegante e moderna saindo do topo -->
  <path d="M256,110 C260,60 300,20 380,10 C390,30 385,85 320,120 C290,136 268,124 256,110 Z" 
        fill="url(#leafGrad)" />
        
  <!-- Cabinho minimalista da maçã -->
  <path d="M256,120 C250,95 258,65 272,45" 
        stroke="#475569" 
        stroke-width="12" 
        stroke-linecap="round" 
        fill="none" />
</svg>